<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sign Up — FurnRent | Create Your Account</title>
<meta name="description" content="Create a FurnRent account to rent premium home and office furniture with free delivery, zero deposit hassle and flexible tenures.">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
.auth-page-wrap{min-height:calc(100vh - var(--header-h) - 300px);display:flex;align-items:center;justify-content:center;padding:60px 20px;background:linear-gradient(180deg,var(--off-white) 0%,var(--blue-pale) 100%)}
[data-theme="dark"] .auth-page-wrap{background:linear-gradient(180deg,var(--off-white) 0%,#09131f 100%)}
.auth-card{background:var(--white);border-radius:var(--radius-xl);padding:44px 40px;box-shadow:var(--shadow-xl);border:1px solid rgba(13,27,42,.08);width:100%;max-width:540px;position:relative}
[data-theme="dark"] .auth-card{background:#142236;border-color:rgba(255,255,255,.12);box-shadow:0 24px 60px rgba(0,0,0,.5)}
.auth-header{text-align:center;margin-bottom:28px}
.auth-logo-badge{width:52px;height:52px;border-radius:13px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;box-shadow:0 8px 20px rgba(74,144,217,.3);overflow:hidden}
.auth-logo-badge img{width:100%;height:100%;display:block}
.auth-header h1{font-size:1.625rem;font-weight:800;color:var(--dark);margin-bottom:8px}
[data-theme="dark"] .auth-header h1{color:#ffffff}
.auth-header p{color:var(--gray-500);font-size:.875rem}
[data-theme="dark"] .auth-header p{color:rgba(255,255,255,.75)}

.form-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:480px){.form-grid-2{grid-template-columns:1fr}}

.form-group{margin-bottom:18px}
.form-label{display:block;font-size:.8125rem;font-weight:700;color:var(--dark);margin-bottom:8px}
[data-theme="dark"] .form-label{color:rgba(255,255,255,.9)}
.input-with-icon{position:relative}
.input-with-icon i.field-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--gray-400);font-size:.9rem}
.input-with-icon input,.input-with-icon select{width:100%;padding:12px 42px 12px 42px;border:1.5px solid var(--gray-200);border-radius:var(--radius-md);background:var(--white);color:var(--dark);font-size:.9375rem;transition:border-color .2s;outline:none}
[data-theme="dark"] .input-with-icon input,[data-theme="dark"] .input-with-icon select{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.15);color:#ffffff}
.input-with-icon input:focus,.input-with-icon select:focus{border-color:var(--blue)}
.toggle-pwd{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--gray-400);cursor:pointer;font-size:.9rem}

.terms-wrap{display:flex;align-items:flex-start;gap:10px;margin-bottom:24px;font-size:.8125rem;color:var(--gray-600);line-height:1.5}
[data-theme="dark"] .terms-wrap{color:rgba(255,255,255,.8)}
.terms-wrap input{margin-top:3px;cursor:pointer;accent-color:var(--blue)}
.terms-wrap a{color:var(--blue);font-weight:600;text-decoration:none}
.terms-wrap a:hover{text-decoration:underline}

.btn-auth-submit{width:100%;justify-content:center;padding:14px;font-size:.9375rem;font-weight:700;border-radius:var(--radius-md)}

.auth-footer-prompt{text-align:center;margin-top:24px;font-size:.875rem;color:var(--gray-600)}
[data-theme="dark"] .auth-footer-prompt{color:rgba(255,255,255,.75)}
.auth-footer-prompt a{color:var(--blue);font-weight:700;text-decoration:none}
.auth-footer-prompt a:hover{text-decoration:underline}
</style>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
</head>
<body>

<!-- Minimal Header (Logo, RTL & Theme Toggle Only) -->
<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="logo"><div class="logo-icon"><img src="images/logo-icon.svg" alt="FurnRent Logo"></div><span class="logo-text">Furn<span>Rent</span></span></a>
    <div class="header-actions" style="margin-left:auto">
      <button class="header-icon-btn rtl-toggle-btn" id="rtlToggleBtn" title="Toggle RTL / LTR Direction" aria-label="Toggle RTL Direction"><i class="fas fa-right-left"></i></button>
      <button class="header-icon-btn theme-toggle-btn" aria-label="Toggle dark/light mode"><i class="fas fa-moon"></i></button>
    </div>
  </div>
</header>

<main class="auth-page-wrap">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo-badge"><img src="images/logo-icon.svg" alt="FurnRent Logo"></div>
      <h1>Create Your Account</h1>
      <p>Join 12,000+ smart urban renters saving on premium furniture across India</p>
    </div>

    <form id="signupForm" onsubmit="handleSignupSubmit(event)">
      <div class="form-grid-2">
        <div class="form-group">
          <label class="form-label" for="signupName">Full Name *</label>
          <div class="input-with-icon">
            <i class="fas fa-user field-icon"></i>
            <input type="text" id="signupName" placeholder="e.g. Aryan Reddy" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="signupCity">Primary City *</label>
          <div class="input-with-icon">
            <i class="fas fa-location-dot field-icon"></i>
            <select id="signupCity" required>
              <option value="Bengaluru">Bengaluru</option>
              <option value="Mumbai">Mumbai</option>
              <option value="Delhi NCR">Delhi NCR</option>
              <option value="Hyderabad">Hyderabad</option>
              <option value="Pune">Pune</option>
              <option value="Chennai">Chennai</option>
              <option value="Other">Other City</option>
            </select>
          </div>
        </div>
      </div>

      <div class="form-grid-2">
        <div class="form-group">
          <label class="form-label" for="signupEmail">Email Address *</label>
          <div class="input-with-icon">
            <i class="fas fa-envelope field-icon"></i>
            <input type="email" id="signupEmail" placeholder="name@domain.com" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="signupPhone">Mobile Number *</label>
          <div class="input-with-icon">
            <i class="fas fa-phone field-icon"></i>
            <input type="tel" id="signupPhone" placeholder="10-digit mobile" pattern="[0-9]{10}" required>
          </div>
        </div>
      </div>

      <div class="form-grid-2">
        <div class="form-group">
          <label class="form-label" for="signupPassword">Password *</label>
          <div class="input-with-icon">
            <i class="fas fa-lock field-icon"></i>
            <input type="password" id="signupPassword" placeholder="Min. 8 characters" required minlength="8">
            <button type="button" class="toggle-pwd" onclick="togglePasswordVisibility('signupPassword', this)"><i class="fas fa-eye"></i></button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="signupConfirmPassword">Confirm Password *</label>
          <div class="input-with-icon">
            <i class="fas fa-lock field-icon"></i>
            <input type="password" id="signupConfirmPassword" placeholder="Re-enter password" required minlength="8">
            <button type="button" class="toggle-pwd" onclick="togglePasswordVisibility('signupConfirmPassword', this)"><i class="fas fa-eye"></i></button>
          </div>
        </div>
      </div>

      <label class="terms-wrap">
        <input type="checkbox" id="agreeTerms" required>
        <span>I agree to FurnRent's <a href="#">Terms of Service</a>, <a href="#">Rental Agreement Policy</a>, and <a href="#">Privacy Policy</a>.</span>
      </label>

      <button type="submit" class="btn btn-primary btn-auth-submit" id="signupSubmitBtn">
        <i class="fas fa-user-plus"></i> Complete Free Registration
      </button>
    </form>

    <div class="auth-footer-prompt">
      Already have an account? <a href="login.html">Log In Here</a>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom" style="border-top:none;padding:24px 0 0;text-align:center">
      <p>© 2024 FurnRent. Premium Furniture Rental across India.</p>
    </div>
  </div>
</footer>

<div class="cart-overlay"></div>
<div class="cart-drawer">
  <div class="cart-header"><div class="cart-title">Your Cart</div><button class="modal-close cart-drawer-close" aria-label="Close cart"><i class="fas fa-times"></i></button></div>
  <div class="cart-body"></div>
  <div class="cart-footer"><div class="cart-total"><span>Total:</span><span class="cart-total-amount">₹0</span></div><a href="packages.html" class="btn btn-primary" style="width:100%;justify-content:center">Checkout</a></div>
</div>
<div class="toast-container"></div>

<script src="js/main.js"></script>
<script>
function togglePasswordVisibility(fieldId, btn) {
  const field = document.getElementById(fieldId);
  const icon = btn.querySelector('i');
  if (field.type === 'password') {
    field.type = 'text';
    icon.className = 'fas fa-eye-slash';
  } else {
    field.type = 'password';
    icon.className = 'fas fa-eye';
  }
}

function handleSignupSubmit(e) {
  e.preventDefault();
  const name = document.getElementById('signupName').value.trim();
  const email = document.getElementById('signupEmail').value.trim();
  const phone = document.getElementById('signupPhone').value.trim();
  const pwd = document.getElementById('signupPassword').value;
  const cpwd = document.getElementById('signupConfirmPassword').value;

  if (pwd !== cpwd) {
    alert('Passwords do not match! Please check and try again.');
    return;
  }

  const submitBtn = document.getElementById('signupSubmitBtn');
  submitBtn.disabled = true;
  submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating Account...';

  setTimeout(() => {
    const user = { name: name, email: email, phone: phone, role: 'customer' };
    localStorage.setItem('furnrent-user', JSON.stringify(user));
    if (window.showToast) window.showToast('Account created successfully! Welcome to FurnRent.', 'success');
    setTimeout(() => {
      window.location.href = 'dashboard.html';
    }, 600);
  }, 700);
}
</script>
</body>
</html>
